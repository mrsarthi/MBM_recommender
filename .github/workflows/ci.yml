name: MBMR CI

on:
  push:
    branches: [ main, tester ]
  pull_request:
    branches: [ main, tester ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Test Suite
        env:
          DATABASE_URL: "postgresql://root:password@localhost:5432/testdb?sslmode=disable"
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          ENCRYPTION_KEY: "mbmr_ci_test_encryption_key_32b=="
          SESSION_SECRET: "mbmr_ci_session_secret_12345"
        run: |
          python -m unittest discover tests
